name: Prérelease Texture3D 1.0.2 bêta 1
on:
  push:
    branches:
      - release/1.0.2-beta.1
permissions:
  contents: write
jobs:
  test-build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test de transcription et de journal inaccessible
        shell: powershell
        run: .\installer\test-transcript.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: node test-painter-bridge.cjs
      - run: python test-painter-resources.py
      - run: python test-painter-texture-export.py
      - run: python test-painter-safety.py
      - run: node test-roundtrip-photoshop.cjs
      - run: node test-painter-viewer.cjs
      - run: node test-object-tools.cjs
      - name: Test de réinstallation
        shell: powershell
        run: .\installer\test-upgrade.ps1
      - name: Construire l'installateur Windows
        shell: powershell
        run: .\installer\build.ps1
      - name: Vérifier l'exécutable et préparer les empreintes
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'distribution\Texture3D-1.0.2'
          $source = Join-Path $dir 'Texture3D-Setup-1.0.2.exe'
          $dest = Join-Path $dir 'Texture3D-Setup-1.0.2-beta.1.exe'
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Installateur introuvable' }
          Move-Item -LiteralPath $source -Destination $dest
          $verified = Join-Path $env:RUNNER_TEMP 'texture3d-package-files.json'
          $verifyProcess = Start-Process -FilePath $dest -ArgumentList @('--verify', ('"' + $verified + '"')) -Wait -PassThru
          if ($verifyProcess.ExitCode -ne 0 -or !(Test-Path -LiteralPath $verified -PathType Leaf)) { throw ('Échec de vérification du paquet (code ' + $verifyProcess.ExitCode + ')') }
          $files = Get-Content -LiteralPath $verified -Raw | ConvertFrom-Json
          if ('companion.cjs' -notin $files -or 'runtime\node.exe' -notin $files) { throw 'Paquet incomplet' }
          $sha = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Texture3D-Setup-1.0.2-beta.1.exe" | Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
      - name: Publier la prérelease avec l'installateur
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.2-beta.1'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'distribution\Texture3D-1.0.2'
          $assets = @((Join-Path $dir 'Texture3D-Setup-1.0.2-beta.1.exe'), (Join-Path $dir 'SHA256SUMS.txt'))
          $existing = gh release view $tag --json targetCommitish --jq '.targetCommitish' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing.Trim() -ne $env:GITHUB_SHA) { throw 'Le tag de prérelease existe déjà sur un autre commit ; refus de le remplacer.' }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Échec de mise à jour des pièces jointes.' }
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title 'Texture3D Studio 1.0.2 — bêta 1' --notes-file installer/NOTES-1.0.2-beta.1.md --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Échec de publication de la prérelease.' }
          }
