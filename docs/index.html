<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17111d">
  <title>Texture3D Studio — Test d’animation</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      --text: #f5eef4;
      --muted: #aa9aa9;
      --accent: #edb1cb;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      min-height: 100svh;
      margin: 0;
      background: radial-gradient(ellipse 65% 60% at 50% 44%, #342239 0%, #231826 43%, #17111d 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }
    .screen {
      width: min(100%, 780px);
      padding: 36px 22px;
      text-align: center;
    }
    .eyebrow {
      color: #c4a2b7;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .23em;
      text-transform: uppercase;
      margin: 0 0 20px;
    }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
      height: clamp(310px, 52vh, 490px);
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(237, 177, 203, .13);
      border-radius: 24px;
      background: radial-gradient(ellipse 60% 60% at 50% 49%, #4a2d44 0%, #291c2e 42%, #1a1420 100%);
      box-shadow: 0 22px 85px #0b071141, inset 0 1px 0 #ffffff0c;
      isolation: isolate;
      transition: border-color .2s, box-shadow .2s;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 100%;
      background: radial-gradient(circle, #d979af24 0%, transparent 67%);
      filter: blur(23px);
      pointer-events: none;
    }
    .stage.dragging {
      border-color: #f1b9d9;
      box-shadow: 0 0 0 3px #edb1cb2e, 0 22px 85px #0b071141;
    }
    .stage.dragging::after {
      content: "Dépose ton animation ici";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f8e6f0;
      font-size: 18px;
      font-weight: 600;
      background: #201324dc;
      z-index: 5;
      pointer-events: none;
    }
    .logo-demo {
      width: min(83%, 380px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .symbol {
      width: 152px;
      max-width: 46%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 0 16px #f4abc04a);
    }
    .symbol path {
      fill: none;
      stroke: #f3bdd2;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .logo-demo.playing .symbol .top {
      stroke-dasharray: 370;
      stroke-dashoffset: 370;
      animation: draw 0.7s cubic-bezier(.32,0,.2,1) .12s forwards;
    }
    .logo-demo.playing .symbol .sides {
      stroke-dasharray: 355;
      stroke-dashoffset: 355;
      animation: draw 0.65s cubic-bezier(.32,0,.2,1) .55s forwards;
    }
    .logo-demo.playing .symbol .middle {
      stroke-dasharray: 110;
      stroke-dashoffset: 110;
      animation: draw .34s ease-out .99s forwards;
    }
    .logo-name {
      font-size: clamp(27px, 5vw, 43px);
      line-height: 1.1;
      letter-spacing: -.045em;
      font-weight: 650;
      margin: 0;
    }
    .logo-subtitle {
      margin: -5px 0 0;
      color: #e1aec7;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .4em;
    }
    .logo-demo.playing .logo-name {
      opacity: 0;
      transform: translateY(8px);
      animation: reveal .58s ease-out 1.15s forwards;
    }
    .logo-demo.playing .logo-subtitle {
      opacity: 0;
      transform: translateY(6px);
      animation: reveal .5s ease-out 1.48s forwards;
    }
    .player {
      display: block;
      max-width: 92%;
      max-height: 92%;
      width: auto;
      height: auto;
      object-fit: contain;
      position: relative;
      z-index: 2;
      border-radius: 5px;
    }
    .actions { margin-top: 26px; display: flex; justify-content: center; }
    .replay {
      border: 1px solid #d9a8c3;
      background: linear-gradient(135deg, #f1c0d5, #d99fbc);
      color: #281426;
      border-radius: 13px;
      padding: 13px 23px;
      min-height: 48px;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 28px #1307164d;
      transition: transform .15s, filter .15s;
    }
    .replay:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .replay:active { transform: translateY(0); }
    .replay:focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }
    .replay svg { width: 18px; height: 18px; }
    .helper { margin: 18px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .status { margin: 7px 0 0; color: #e9bcd2; font-size: 12px; min-height: 1.4em; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) {
      .screen { padding: 26px 14px; }
      .stage { border-radius: 18px; height: 340px; }
      .symbol { width: 120px; }
    }
  
    /* The intro is a self-contained, illustrated SVG; no external assets. */
    .stage { height: clamp(340px, 62vh, 540px); background: radial-gradient(ellipse at 50% 48%,#48334c 0%,#302337 44%,#1b1523 100%); }
    .logo-demo { width: 100%; height: 100%; gap: 0; position: relative; }
    .intro-art { display:block; width:100%; height:100%; overflow:hidden; }
    .intro-art .ink { stroke-linecap:round; stroke-linejoin:round; }
    .intro-art .ground-shadow { transform-box:fill-box; transform-origin:center; }
    .intro-art .cube-motion { transform-origin:360px 350px; opacity:0; }
    .intro-art .sketch { opacity:0; stroke-dasharray:1; stroke-dashoffset:1; }
    .intro-art .figure-motion { transform-origin:360px 350px; }
    .intro-art .paint-window { transform-origin:360px 350px; transform:scaleY(1); }
    .intro-art .pencil-motion { transform-origin:0 0; opacity:0; }
    .intro-art .magic { opacity:0; transform-origin:360px 255px; }
    .intro-art .dust { opacity:0; transform-origin:360px 350px; }
    .intro-art .brand { transform-origin:360px 412px; }
    .intro-art .paint-trail { opacity:0; stroke-dasharray:1; stroke-dashoffset:1; }
    .logo-demo.playing .ground-shadow { animation:groundPulse 5.8s both; }
    .logo-demo.playing .cube-motion { animation:cubeRise 5.8s both; }
    .logo-demo.playing .sketch { animation:sketchDraw 5.8s linear both; }
    .logo-demo.playing .figure-motion { animation:figureGrow 5.8s both; }
    .logo-demo.playing .paint-window { animation:paintReveal 5.8s both; }
    .logo-demo.playing .pencil-motion { animation:pencilDance 5.8s both; }
    .logo-demo.playing .magic { animation:magicBurst 5.8s both; }
    .logo-demo.playing .dust { animation:dustPuff 5.8s both; }
    .logo-demo.playing .brand { animation:brandReveal 5.8s both; }
    .logo-demo.playing .paint-trail { animation:trailDraw 5.8s linear both; }
    @keyframes groundPulse {
      0%{transform:scale(.15,.55);opacity:0}
      7%{opacity:.55} 18%{transform:scale(1.04,1);opacity:.9}
      23%,39%{transform:scale(.92,.9);opacity:.75}
      51%{transform:scale(1.17,1);opacity:.85} 100%{transform:scale(1);opacity:.75}
    }
    @keyframes cubeRise {
      0%,3%{opacity:1;transform:translateY(175px) scale(.84,1.06)}
      14%{opacity:1;transform:translateY(-12px) scale(.94,1.09)}
      18%{opacity:1;transform:translateY(0) scale(1.1,.88)}
      24%,39%{opacity:1;transform:translateY(0) scale(1)}
      44%{opacity:1;transform:translateY(-6px) scale(.77,1.25)}
      50%{opacity:0;transform:translateY(-15px) scale(.18,1.52)}
      51%,100%{opacity:0;transform:scale(.01)}
    }
    @keyframes sketchDraw {
      0%,23%{opacity:0;stroke-dashoffset:1}
      24%{opacity:1;stroke-dashoffset:1}
      39%,43%{opacity:1;stroke-dashoffset:0}
      49%,100%{opacity:0;stroke-dashoffset:0}
    }
    @keyframes figureGrow {
      0%,40%{opacity:0;transform:translateY(0) scale(.42,.38)}
      44%{opacity:.25;transform:translateY(-4px) scale(.48,.56)}
      50%{opacity:1;transform:translateY(-8px) scale(.94,1.06)}
      55%{opacity:1;transform:translateY(0) scale(1.04,.97)}
      61%,100%{opacity:1;transform:scale(1)}
    }
    @keyframes paintReveal {
      0%,55%{transform:scaleY(0)}
      63%{transform:scaleY(.30)}
      70%{transform:scaleY(.57)}
      77%{transform:scaleY(.82)}
      83%,100%{transform:scaleY(1)}
    }
    @keyframes pencilDance {
      0%,15%{opacity:0;transform:translate(690px,80px) rotate(25deg)}
      21%{opacity:1;transform:translate(435px,235px) rotate(9deg)}
      24%{opacity:1;transform:translate(395px,257px) rotate(-9deg)}
      28%{opacity:1;transform:translate(331px,242px) rotate(-20deg)}
      32%{opacity:1;transform:translate(315px,290px) rotate(13deg)}
      36%{opacity:1;transform:translate(385px,310px) rotate(-12deg)}
      40%{opacity:1;transform:translate(432px,269px) rotate(9deg)}
      45%{opacity:1;transform:translate(465px,184px) rotate(29deg)}
      51%{opacity:1;transform:translate(472px,309px) rotate(-7deg)}
      55%{opacity:1;transform:translate(400px,334px) rotate(-14deg)}
      59%{opacity:1;transform:translate(323px,316px) rotate(-22deg)}
      63%{opacity:1;transform:translate(409px,285px) rotate(8deg)}
      67%{opacity:1;transform:translate(305px,258px) rotate(-15deg)}
      71%{opacity:1;transform:translate(417px,229px) rotate(15deg)}
      75%{opacity:1;transform:translate(328px,197px) rotate(-15deg)}
      79%{opacity:1;transform:translate(390px,159px) rotate(10deg)}
      83%{opacity:1;transform:translate(367px,130px) rotate(-8deg)}
      88%{opacity:1;transform:translate(493px,177px) rotate(34deg)}
      91%{opacity:1;transform:translate(502px,158px) rotate(15deg)}
      97%,100%{opacity:0;transform:translate(690px,55px) rotate(35deg)}
    }
    @keyframes magicBurst {
      0%,39%{opacity:0;transform:scale(.3) rotate(-10deg)}
      44%{opacity:.95;transform:scale(.75)}
      50%{opacity:.8;transform:scale(1.15) rotate(12deg)}
      57%,100%{opacity:0;transform:scale(1.55) rotate(22deg)}
    }
    @keyframes dustPuff {
      0%,12%{opacity:0;transform:scale(.3)}
      18%{opacity:.85;transform:scale(.75)}
      25%,100%{opacity:0;transform:scale(1.4)}
    }
    @keyframes trailDraw {
      0%,54%{opacity:0;stroke-dashoffset:1}
      56%{opacity:.7;stroke-dashoffset:1}
      82%{opacity:.7;stroke-dashoffset:0}
      90%,100%{opacity:0;stroke-dashoffset:0}
    }
    @keyframes brandReveal {
      0%,84%{opacity:0;transform:translateY(12px)}
      96%,100%{opacity:1;transform:translateY(0)}
    }
    @media(max-width:520px){.stage{height:360px}.screen{padding:24px 12px}}

  </style>
</head>

            <path d="M250 203l6-10 6 10-6 10Z M457 216l5-9 5 9-5 9Z M414 132l4-7 4 7-4 7Z" fill="#ffe4b7" stroke="none"/>
            <path d="M288 174v14m-7-7h14M463 290v14m-7-7h14M255 276v10m-5-5h10" stroke-width="2"/>
          </g>
          <path class="paint-trail" pathLength="1" d="M400 334Q300 340 323 316T409 285T305 258T417 229T328 197T390 159T367 130" fill="none" stroke="#f6cf9b" stroke-width="2" stroke-linecap="round"/>
          <!-- Pencil tip is the origin, so the tip follows the drawn path. -->
          <g class="pencil-motion ink" stroke="#55394e" stroke-width="1.5">
            <g transform="rotate(35)">
              <path d="M0 0L-10 -19L-10 -81Q0 -87 10 -81L10 -19Z" fill="#f4c778"/>
              <path d="M-10 -19L0 0L10 -19L0 -16Z" fill="#f7dfb8"/>
              <path d="M0 0L-3 -6L3 -6Z" fill="#47354e"/>
              <path d="M-5 -23V-78" stroke="#fff0b0" stroke-width="3"/>
              <path d="M6 -22V-79" stroke="#c58b5b" stroke-width="3"/>
              <path d="M-10 -78V-90Q0 -97 10 -90V-78Z" fill="#d88ba7"/>
              <path d="M-10 -79H10V-72H-10Z" fill="#c6b8c8"/>
              <path d="M-4 -51v3M4 -51v3M-3 -44Q0 -41 3 -44" fill="none" stroke="#593b4e" stroke-width="1.7"/>
              <path d="M-12 -48Q-20 -46 -19 -39M12 -48Q20 -48 20 -55" fill="none" stroke="#f5d8d0" stroke-width="2.2"/>
              <circle cx="-19" cy="-39" r="2.5" fill="#f5d8d0" stroke="none"/><circle cx="20" cy="-55" r="2.5" fill="#f5d8d0" stroke="none"/>
            </g>
          </g>
          <g class="brand" text-anchor="middle">
            <text x="360" y="405" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="650" letter-spacing="-1.4" fill="#fff2f3">Texture3D</text>
            <text x="360" y="426" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" letter-spacing="4.5" fill="#e3b4cd">STUDIO</text>
          </g>
        </svg>
      </div>
    </section>
    <div class="actions">
      <button class="replay" id="replay" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11a9 9 0 1 1 2.64 6.36" />
          <path d="M3 3v8h8" />
        </svg>
        Relancer l’animation
      </button>
    </div>
    <p class="helper">Tu peux glisser ton GIF, WebM, MP4 ou WebP animé au milieu de la page pour le tester.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const demo = document.getElementById('logoDemo');
    const replayButton = document.getElementById('replay');
    const status = document.getElementById('status');
    let importedFile = null;
    let mediaElement = null;
    let mediaURL = null;

    function restartDemo() {
      demo.classList.remove('playing');
      // Reflow réinitialise les animations CSS avant de les relancer.
      void demo.offsetWidth;
      demo.classList.add('playing');
    }

    function releaseURL() {
      if (mediaURL) URL.revokeObjectURL(mediaURL);
      mediaURL = null;
    }

    function playImported() {
      if (!importedFile) return;
      const isVideo = importedFile.type.startsWith('video/') || /\.(mp4|webm|mov)$/i.test(importedFile.name);
      releaseURL();
      mediaURL = URL.createObjectURL(importedFile);
      if (mediaElement) mediaElement.remove();
      mediaElement = document.createElement(isVideo ? 'video' : 'img');
      mediaElement.className = 'player';
      if (isVideo) {
        mediaElement.muted = true;
        mediaElement.playsInline = true;
        mediaElement.autoplay = true;
        mediaElement.loop = false;
        mediaElement.src = mediaURL;
        mediaElement.addEventListener('loadeddata', () => {
          mediaElement.currentTime = 0;
          mediaElement.play().catch(() => { status.textContent = 'Clique sur « Relancer l’animation » pour lire cette vidéo.'; });
        }, { once: true });
        mediaElement.addEventListener('error', () => { status.textContent = 'Format vidéo non pris en charge par ce navigateur.'; }, { once: true });
      } else {
        mediaElement.alt = 'Animation importée : ' + importedFile.name;
        mediaElement.src = mediaURL;
        mediaElement.addEventListener('error', () => { status.textContent = 'Image non prise en charge par ce navigateur.'; }, { once: true });
      }
      stage.append(mediaElement);
    }

    function replay() {
      if (importedFile) playImported();
      else restartDemo();
    }

    function handleFile(file) {
      if (!file) return;
      if (!(file.type.startsWith('image/') || file.type.startsWith('video/') || /\.(gif|webp|png|apng|mp4|webm|mov)$/i.test(file.name))) {
        status.textContent = 'Utilise un fichier GIF, WebP animé, APNG, WebM ou MP4.';
        return;
      }
      importedFile = file;
      demo.hidden = true;
      status.textContent = 'Animation chargée : ' + file.name;
      playImported();
    }

    replayButton.addEventListener('click', replay);
    let dragDepth = 0;
    window.addEventListener('dragenter', (event) => {
      if (!event.dataTransfer?.types.includes('Files')) return;
      event.preventDefault();
      dragDepth += 1;
      stage.classList.add('dragging');
    });
    window.addEventListener('dragover', (event) => { event.preventDefault(); });
    window.addEventListener('dragleave', () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) stage.classList.remove('dragging');
    });
    window.addEventListener('drop', (event) => {
      event.preventDefault();
      dragDepth = 0;
      stage.classList.remove('dragging');
      handleFile(event.dataTransfer?.files?.[0]);
    });
    window.addEventListener('pagehide', releaseURL);
    restartDemo();
  </script>
</body>
</html>
