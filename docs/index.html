<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17111d">
  <title>Texture3D Studio — Test d’animation</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      --text: #f5eef4;
      --muted: #aa9aa9;
      --accent: #edb1cb;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      min-height: 100svh;
      margin: 0;
      background: radial-gradient(ellipse 65% 60% at 50% 44%, #342239 0%, #231826 43%, #17111d 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }
    .screen {
      width: min(100%, 780px);
      padding: 36px 22px;
      text-align: center;
    }
    .eyebrow {
      color: #c4a2b7;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .23em;
      text-transform: uppercase;
      margin: 0 0 20px;
    }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
      height: clamp(310px, 52vh, 490px);
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(237, 177, 203, .13);
      border-radius: 24px;
      background: radial-gradient(ellipse 60% 60% at 50% 49%, #4a2d44 0%, #291c2e 42%, #1a1420 100%);
      box-shadow: 0 22px 85px #0b071141, inset 0 1px 0 #ffffff0c;
      isolation: isolate;
      transition: border-color .2s, box-shadow .2s;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 100%;
      background: radial-gradient(circle, #d979af24 0%, transparent 67%);
      filter: blur(23px);
      pointer-events: none;
    }
    .stage.dragging {
      border-color: #f1b9d9;
      box-shadow: 0 0 0 3px #edb1cb2e, 0 22px 85px #0b071141;
    }
    .stage.dragging::after {
      content: "Dépose ton animation ici";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f8e6f0;
      font-size: 18px;
      font-weight: 600;
      background: #201324dc;
      z-index: 5;
      pointer-events: none;
    }
    .logo-demo {
      width: min(83%, 380px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .symbol {
      width: 152px;
      max-width: 46%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 0 16px #f4abc04a);
    }
    .symbol path {
      fill: none;
      stroke: #f3bdd2;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .logo-demo.playing .symbol .top {
      stroke-dasharray: 370;
      stroke-dashoffset: 370;
      animation: draw 0.7s cubic-bezier(.32,0,.2,1) .12s forwards;
    }
    .logo-demo.playing .symbol .sides {
      stroke-dasharray: 355;
      stroke-dashoffset: 355;
      animation: draw 0.65s cubic-bezier(.32,0,.2,1) .55s forwards;
    }
    .logo-demo.playing .symbol .middle {
      stroke-dasharray: 110;
      stroke-dashoffset: 110;
      animation: draw .34s ease-out .99s forwards;
    }
    .logo-name {
      font-size: clamp(27px, 5vw, 43px);
      line-height: 1.1;
      letter-spacing: -.045em;
      font-weight: 650;
      margin: 0;
    }
    .logo-subtitle {
      margin: -5px 0 0;
      color: #e1aec7;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .4em;
    }
    .logo-demo.playing .logo-name {
      opacity: 0;
      transform: translateY(8px);
      animation: reveal .58s ease-out 1.15s forwards;
    }
    .logo-demo.playing .logo-subtitle {
      opacity: 0;
      transform: translateY(6px);
      animation: reveal .5s ease-out 1.48s forwards;
    }
    .player {
      display: block;
      max-width: 92%;
      max-height: 92%;
      width: auto;
      height: auto;
      object-fit: contain;
      position: relative;
      z-index: 2;
      border-radius: 5px;
    }
    .actions { margin-top: 26px; display: flex; justify-content: center; }
    .replay {
      border: 1px solid #d9a8c3;
      background: linear-gradient(135deg, #f1c0d5, #d99fbc);
      color: #281426;
      border-radius: 13px;
      padding: 13px 23px;
      min-height: 48px;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 28px #1307164d;
      transition: transform .15s, filter .15s;
    }
    .replay:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .replay:active { transform: translateY(0); }
    .replay:focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }
    .replay svg { width: 18px; height: 18px; }
    .helper { margin: 18px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .status { margin: 7px 0 0; color: #e9bcd2; font-size: 12px; min-height: 1.4em; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) {
      .screen { padding: 26px 14px; }
      .stage { border-radius: 18px; height: 340px; }
      .symbol { width: 120px; }
    }
  
    /* The intro is a self-contained, illustrated SVG; no external assets. 7,5 s au total. */
    .stage { height: clamp(340px, 62vh, 540px); background: radial-gradient(ellipse at 50% 48%,#48334c 0%,#302337 44%,#1b1523 100%); }
    .logo-demo { width: 100%; height: 100%; gap: 0; position: relative; }
    .intro-art { display:block; width:100%; height:100%; overflow:hidden; }
    .intro-art .ink { stroke-linecap:round; stroke-linejoin:round; }
    .intro-art .ground-shadow { transform-box:fill-box; transform-origin:center; }
    .intro-art .cube-motion { transform-origin:360px 350px; opacity:0; }
    .intro-art .sketch { opacity:0; stroke-dasharray:1; stroke-dashoffset:1; }
    .intro-art .figure-motion { transform-origin:360px 350px; opacity:0; }
    .intro-art .idle { transform-origin:360px 350px; }
    .intro-art .pencil-motion { offset-path:path('M690 70 L520 120 L295.6 228.4 L359.8 197.8 L370.7 203.8 L305.9 234.8 L315.7 239.7 L377.3 209.3 L392.5 215.1 L325.5 244.1 L341.3 249.5 L401.6 218.8 L412.4 222.2 L349.9 252.6 L355.7 259.0 L422.4 230.4 L284.4 244.2 L349.7 275.6 L349.2 285.6 L283.8 253.9 L287.0 267.9 L348.0 298.7 L348.7 309.4 L287.6 280.8 L284.7 290.4 L349.1 323.4 L350.1 333.1 L288.5 301.9 L370.6 277.0 L432.2 245.5 L431.6 258.0 L372.4 286.9 L373.0 297.1 L434.9 267.6 L434.4 278.8 L372.8 311.2 L370.9 322.5 L431.7 292.7 L434.7 303.9 L372.7 331.7 L362 342 L282 304 L281 232 L360 194 L439 232 L439 304 L362 342 L395 300 L360 262'); offset-rotate:0deg; offset-anchor:0 0; offset-distance:0%; opacity:0; }
    .intro-art .pencil-wiggle { transform-origin:0 0; }
    .intro-art .cloud { opacity:0; }
    .intro-art .puff, .intro-art .puff > *, .intro-art .tool, .intro-art .bit { transform-box:fill-box; transform-origin:center; }
    .intro-art .puff, .intro-art .tool, .intro-art .bit { opacity:0; }
    .intro-art .magic { opacity:0; transform-origin:360px 240px; }
    .intro-art .dust { opacity:0; transform-origin:360px 350px; }
    .intro-art .brand { transform-origin:360px 412px; opacity:0; }
    .logo-demo.playing .ground-shadow { animation:groundPulse 7.5s both; }
    .logo-demo.playing .cube-motion { animation:cubeRise 7.5s both; }
    .logo-demo.playing .sketch { animation:sketchDraw 7.5s linear both; }
    .logo-demo.playing .pencil-motion { animation:pencilPath 7.5s linear both; }
    .logo-demo.playing .pencil-wiggle { animation:pencilWiggle .18s ease-in-out infinite alternate; }
    .logo-demo.playing .cloud { animation:cloudLife 7.5s both, cloudShake .11s steps(2) infinite; }
    .logo-demo.playing .puff { animation:puffLife 7.5s both; animation-delay:var(--d,0s); }
    .logo-demo.playing .puff > * { animation:boil .3s ease-in-out infinite alternate; animation-delay:var(--b,0s); }
    .logo-demo.playing .tool { animation:toolPop 7.5s both; animation-delay:var(--d,0s); }
    .logo-demo.playing .bit { animation:bitFly 7.5s ease-out both; animation-delay:var(--d,0s); }
    .logo-demo.playing .figure-motion { animation:figurePop 7.5s both; }
    .logo-demo.playing .idle { animation:idle 2.6s ease-in-out 7.5s infinite; }
    .logo-demo.playing .magic { animation:magicBurst 7.5s both; }
    .logo-demo.playing .dust { animation:dustPuff 7.5s both; }
    .logo-demo.playing .brand { animation:brandReveal 7.5s both; }
    .intro-art .plume { transform-box:fill-box; transform-origin:center; opacity:0; }
    .logo-demo.playing .plume { animation:plume 1.1s ease-out infinite; animation-delay:var(--d,0s); }
    .logo-demo.playing .plumes { animation:plumesLife 7.5s both; }
    @keyframes plume { 0%{opacity:0;transform:translate(0,0) scale(.5)} 20%{opacity:.85} 100%{opacity:0;transform:translate(var(--sx),-150px) scale(1.9)} }
    @keyframes plumesLife { 0%,49%{opacity:0} 51%,74%{opacity:1} 82%,100%{opacity:0} }
    @keyframes groundPulse {
      0%{transform:scale(.15,.55);opacity:0}
      6%{opacity:.55} 15%{transform:scale(1.04,1);opacity:.9}
      19%,46%{transform:scale(.95,.92);opacity:.75}
      52%,72%{transform:scale(1.45,1.1);opacity:.95}
      80%{transform:scale(.8,.9);opacity:.8} 100%{transform:scale(.88,.92);opacity:.75}
    }
    @keyframes cubeRise {
      0%,2%{opacity:1;transform:translateY(175px) scale(.84,1.06)}
      12%{opacity:1;transform:translateY(-12px) scale(.94,1.09)}
      15%{opacity:1;transform:translateY(0) scale(1.1,.88)}
      19%{opacity:1;transform:translateY(0) scale(1)}
      45%{opacity:1;transform:translate(0,0) rotate(0)}
      46.5%{opacity:1;transform:translate(-4px,-2px) rotate(-2deg)}
      48%{opacity:1;transform:translate(5px,1px) rotate(2.5deg)}
      49.5%{opacity:1;transform:translate(-5px,-3px) rotate(-3deg) scale(1.03,.97)}
      51%{opacity:1;transform:translate(4px,0) rotate(2deg) scale(.97,1.04)}
      54%{opacity:1;transform:translateY(4px) scale(.9)}
      55%,100%{opacity:0;transform:scale(.01)}
    }
    @keyframes sketchDraw {
      0%,19.9%{opacity:0;stroke-dashoffset:1}
      20%{opacity:1;stroke-dashoffset:1}
      48%{opacity:1;stroke-dashoffset:0}
      100%{opacity:1;stroke-dashoffset:0}
    }
    @keyframes pencilPath {
      0%,14.6%{opacity:0;offset-distance:0%}
      14.7%{opacity:1;offset-distance:0%;animation-timing-function:ease-out}
      20%{opacity:1;offset-distance:15.35%;animation-timing-function:linear}
      48%{opacity:1;offset-distance:96.22%;animation-timing-function:ease-in}
      51.5%{opacity:1;offset-distance:100%;transform:scale(1)}
      53%,100%{opacity:0;offset-distance:100%;transform:scale(.2)}
    }
    @keyframes pencilWiggle { from{transform:rotate(-6deg) translateY(-1px)} to{transform:rotate(6deg) translateY(1px)} }
    @keyframes cloudLife { 0%,48%{opacity:0} 49%,79%{opacity:1} 88%,100%{opacity:0} }
    @keyframes cloudShake { 0%{transform:translate(-2px,1px)} 100%{transform:translate(2px,-1px)} }
    @keyframes puffLife {
      0%,49%{opacity:0;transform:scale(0)}
      52%{opacity:1;transform:scale(1.15)}
      55%,73%{opacity:1;transform:scale(1)}
      76%{opacity:.9;transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.4)) scale(1.12)}
      83%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}
    }
    @keyframes boil { from{transform:scale(1,1)} to{transform:scale(1.06,.94)} }
    @keyframes toolPop {
      0%,53%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}
      55%{opacity:1;transform:translate(calc(var(--tx)*.8),calc(var(--ty)*.8)) scale(1.1) rotate(calc(var(--r)*.6))}
      58%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--r))}
      61%,100%{opacity:0;transform:translate(0,0) scale(.3) rotate(calc(var(--r)*-1))}
    }
    @keyframes bitFly {
      0%,50%{opacity:0;transform:translate(0,0) scale(.4)}
      52%{opacity:1}
      60%,100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1)}
    }
    @keyframes figurePop {
      0%,70%{opacity:0;transform:scale(.55)}
      72%{opacity:1;transform:scale(.6)}
      78%{opacity:1;transform:translateY(-14px) scale(.94,1.1)}
      81%{opacity:1;transform:translateY(0) scale(1.1,.9)}
      84%{opacity:1;transform:translateY(-3px) scale(.97,1.03)}
      87%,100%{opacity:1;transform:translateY(0) scale(1)}
    }
    @keyframes idle { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.008,1.018)} }
    @keyframes magicBurst {
      0%,76%{opacity:0;transform:scale(.4) rotate(-10deg)}
      80%{opacity:.95;transform:scale(.9)}
      86%{opacity:.75;transform:scale(1.15) rotate(12deg)}
      93%,100%{opacity:0;transform:scale(1.45) rotate(22deg)}
    }
    @keyframes dustPuff {
      0%,11%{opacity:0;transform:scale(.3)}
      15%{opacity:.85;transform:scale(.75)}
      21%,100%{opacity:0;transform:scale(1.4)}
    }
    @keyframes brandReveal {
      0%,84%{opacity:0;transform:translateY(12px)}
      93%,100%{opacity:1;transform:translateY(0)}
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-demo.playing .cloud, .logo-demo.playing .plume, .logo-demo.playing .puff > *, .logo-demo.playing .pencil-wiggle, .logo-demo.playing .idle { animation:none; }
    }
    @media(max-width:520px){.stage{height:360px}.screen{padding:24px 12px}}

  </style>
</head>

    <p class="eyebrow">Texture3D Studio · Animation Lab</p>
    <section class="stage" id="stage" aria-label="Prévisualisation de l’animation">

                <path d="M336 207L341 201L339 215L333 220Z M378 201L384 207L386 216L380 213Z"/>

                <path d="M339 137L343 132L345 138Z M369 160L379 157L374 165Z"/>
              </g>
              <g fill="var(--gold)" stroke="none"><path d="M345 214l3 4-3 4-3-4Z"/><path d="M375 214l3 4-3 4-3-4Z"/></g>
            </g>
            <g id="pencil" class="ink" stroke="#55394e" stroke-width="1.5">
              <g transform="rotate(35)">
                <path d="M0 0L-10 -19L-10 -81Q0 -87 10 -81L10 -19Z" fill="#f4c778"/>
                <path d="M-10 -19L0 0L10 -19L0 -16Z" fill="#f7dfb8"/>

        </svg>
        Relancer l’animation
      </button>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const demo = document.getElementById('logoDemo');
    const replayButton = document.getElementById('replay');
    const status = document.getElementById('status');
    let importedFile = null;
    let mediaElement = null;
    let mediaURL = null;

    function restartDemo() {
      demo.classList.remove('playing');
      // Reflow réinitialise les animations CSS avant de les relancer.
      void demo.offsetWidth;
      demo.classList.add('playing');
    }

    function releaseURL() {
      if (mediaURL) URL.revokeObjectURL(mediaURL);
      mediaURL = null;
    }

    function playImported() {
      if (!importedFile) return;
      const isVideo = importedFile.type.startsWith('video/') || /\.(mp4|webm|mov)$/i.test(importedFile.name);
      releaseURL();
      mediaURL = URL.createObjectURL(importedFile);
      if (mediaElement) mediaElement.remove();
      mediaElement = document.createElement(isVideo ? 'video' : 'img');
      mediaElement.className = 'player';
      if (isVideo) {
        mediaElement.muted = true;
        mediaElement.playsInline = true;
        mediaElement.autoplay = true;
        mediaElement.loop = false;
        mediaElement.src = mediaURL;
        mediaElement.addEventListener('loadeddata', () => {
          mediaElement.currentTime = 0;
          mediaElement.play().catch(() => { status.textContent = 'Clique sur « Relancer l’animation » pour lire cette vidéo.'; });
        }, { once: true });
        mediaElement.addEventListener('error', () => { status.textContent = 'Format vidéo non pris en charge par ce navigateur.'; }, { once: true });
      } else {
        mediaElement.alt = 'Animation importée : ' + importedFile.name;
        mediaElement.src = mediaURL;
        mediaElement.addEventListener('error', () => { status.textContent = 'Image non prise en charge par ce navigateur.'; }, { once: true });
      }
      stage.append(mediaElement);
    }

    function replay() {
      if (importedFile) playImported();
      else restartDemo();
    }

    function handleFile(file) {
      if (!file) return;
      if (!(file.type.startsWith('image/') || file.type.startsWith('video/') || /\.(gif|webp|png|apng|mp4|webm|mov)$/i.test(file.name))) {
        status.textContent = 'Utilise un fichier GIF, WebP animé, APNG, WebM ou MP4.';
        return;
      }
      importedFile = file;
      demo.hidden = true;
      status.textContent = 'Animation chargée : ' + file.name;
      playImported();
    }

    replayButton.addEventListener('click', replay);
    let dragDepth = 0;
    window.addEventListener('dragenter', (event) => {
      if (!event.dataTransfer?.types.includes('Files')) return;
      event.preventDefault();
      dragDepth += 1;
      stage.classList.add('dragging');
    });
    window.addEventListener('dragover', (event) => { event.preventDefault(); });
    window.addEventListener('dragleave', () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) stage.classList.remove('dragging');
    });
    window.addEventListener('drop', (event) => {
      event.preventDefault();
      dragDepth = 0;
      stage.classList.remove('dragging');
      handleFile(event.dataTransfer?.files?.[0]);
    });
    window.addEventListener('pagehide', releaseURL);
    restartDemo();
  </script>
